<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ციფრული სავიზიტო ბარათი</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007bff;
            margin-bottom: 15px;
        }
        h2 { margin: 10px 0 5px 0; color: #333; }
        p { color: #666; margin: 0 0 20px 0; }
        .btn {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="card">
        <!-- თქვენი ლოგოს ფაილი -->
        <img src="logo.png" alt="Logo" class="logo">
        
        <h2>Beka Zhvania</h2>
        <p>LTD "ROBATRANZIT"</p>
        <p>E-mail: ltdrobatranzit@gmail.com"</p>
        
        <!-- ღილაკი კონტაქტის გადმოსაწერად -->
        <a href="contact.vcf" class="btn">👤 კონტაქტებში შენახვა</a>
    </div>

</body>
</html>
